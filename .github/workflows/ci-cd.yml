name: DevSecOps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'kubernetes/deployment.yaml'
  pull_request:
    branches:
      - main
      
jobs:
  test: 
    name: Unit tests
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code 
        uses: action/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version: '20' 
          cache: 'npm'
        