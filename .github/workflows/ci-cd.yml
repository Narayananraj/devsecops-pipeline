name: DevSecOps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'kubernetes/deployment.yaml'
  pull_request:
    branches:
      - main
      
jobs:
  test: 
    name: Unit tests
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4 
        with: 
          node-version-file: '.nvmrc'
          cache: 'npm'
        
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test 

  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
